<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1c19">
  <title>Foundry Maintenance Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Sign-in -->
  <div id="login-screen" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand big"><span class="mark"></span><div><h1>Foundry Maintenance</h1><p>Management System</p></div></div>
      <label>Username <input name="username" autocomplete="username" required autofocus></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="login-error" hidden></p>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>
  </div>

  <!-- App shell -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="mark"></span><div><h1 id="brand-title">Foundry Maintenance</h1><p>Management System</p></div></div>
      <nav id="side-nav"></nav>
      <div class="side-user" id="side-user"></div>
    </aside>

    <div class="content">
      <header class="topbar">
        <h2 id="page-title"></h2>
        <div class="top-actions">
          <button class="btn primary" id="quick-report" type="button">+ Report Breakdown</button>
          <button class="icon-btn user-btn" id="user-btn" type="button" aria-label="Account"></button>
        </div>
      </header>
      <main id="view"></main>
    </div>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
